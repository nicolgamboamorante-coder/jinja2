<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Mi Sitio{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #333; }
        header { background: #2c3e50; color: white; padding: 1rem 2rem; }
        nav { background: #34495e; padding: 0.5rem 2rem; }
        nav a { color: #ecf0f1; text-decoration: none; margin-right: 1rem; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        footer { background: #2c3e50; color: #ecf0f1; text-align: center; padding: 1rem; margin-top: 3rem; }
    </style>
</head>
<body>
    <header>
        <h1>{% block encabezado %}Bienvenido{% endblock %}</h1>
    </header>
    <nav>
        <a href="/deporte">Deporte</a>
        <a href="/planetas">Planetas</a>
        <a href="/categorias">Categorías</a>
    </nav>
    <main>
        {% block contenido %}
        <p>Contenido por defecto.</p>
        {% endblock %}
    </main>
    <footer>
        <p>&copy; 2026 Taller Grupo 6: Nicol Gamboa y Valeria Mendez</p>
    </footer>
</body>
</html>
